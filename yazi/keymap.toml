[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "i"
run  = "plugin max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on   = "<C-j>"
run  = "arrow 1"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = [ ";", "w" ]
run = "cd ~/Code/Work/"
desc = "Work directory"

[[mgr.prepend_keymap]]
on = [ ";", "s" ]
run = "cd ~/Code/Scolaire/"
desc = "School directory"

[[mgr.prepend_keymap]]
on = [ ";", "c" ]
run = "cd ~/.config/"
desc = "Config directory"

[[mgr.prepend_keymap]]
on = [ ";", "h" ]
run = "cd ~/"
desc = "Home directory"

[[mgr.prepend_keymap]]
on = [ ";", "d" ]
run = "cd ~/Downloads"
desc = "Downloads"

[[mgr.prepend_keymap]]
on = [ ";", "p" ]
run = "cd ~/Code/Projects/"
desc = "Code projects"

[[mgr.prepend_keymap]]
on = [ ";", "t" ]
run = "cd .Trash/"
desc = "Trash folder"

[[mgr.prepend_keymap]]
on = "y"
run = [ '''shell 'fish -c "copy_file \"$@\""' ''', "yank" ]

[[mgr.prepend_keymap]]
on = [ ";", "u" ]
run = "cd /Volumes"
desc = "Mounted volumes"

[[mgr.prepend_keymap]]
on = [ ";", "D" ]
run = "cd '/Users/grimaldev/Library/Mobile Documents/com~apple~CloudDocs/documents'"
desc = "Icloud Documents"

[[mgr.prepend_keymap]]
on = [ "S" ]
run = '''shell 'fish -c "share \"$@\""' --confirm'''
desc = "Share file"

[[mgr.prepend_keymap]]
on = [ "o" ]
run = [ '''shell 'fish -c "open \"$@\""' ''', "quit" ]
desc = "Open file and quit yazi"

[[mgr.prepend_keymap]]
on = [ "z" ]
run = '''shell 'fish -c "zathura \"$@\" & disown"' '''
desc = "Open PDF with Zathura"

[[mgr.prepend_keymap]]
on = [ "s" ]
run = "plugin fzf"
desc = "Fuzzy search in current folder"

[[mgr.prepend_keymap]]
on = ["e"]
run = "7zz x '$f' -o'$d'"
desc = "Extract archive with 7zz"

[[mgr.prepend_keymap]]
on   = "<C-s>"
run  = 'shell --block --confirm "sesh connect "$0" && exit"'
desc = "Quit and connect to sesh session"

