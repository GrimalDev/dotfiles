# Keybindings Configuration
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# See https://wiki.hyprland.org/Configuring/Binds/ for more
$mainMod = SUPER

# Application binds
bind = $mainMod, R, exec, kitty -e sesh connect "Home " # open the terminal
bind = $mainMod SHIFT, R, exec, kitty # opent terminal
bind = $mainMod, E, exec, footclient yazi # Show the graphical file browser
bind = Alt, SPACE, exec, rofi -theme "~/.config/rofi/launchers/type-6/style-7.rasi" -show drun
bind = $mainMod, B, exec, footclient bluetui
bind = $mainMod, W, exec, footclient wifitui
bind = $mainMod, C, exec, footclient hyprmon
bind = $mainMod, P, exec, footclient pulsemixer
bind = $mainMod, SPACE, exec, 1password --quick-access

# Window management
bind = $mainMod, Q, killactive, # close the active window
bind = $mainMod, G, fullscreen, # fullscreen the active window
bind = $mainMod, F, togglefloating, # Allow a window to float

# System
bind = $mainMod ALT, L, exec, 1password --lock ; hyprlock # Lock the screen
bind = $mainMod SHIFT, M, exit, # Exit Hyprland all together no (force quit Hyprland)

# Screenshot
bind = $mainMod, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SuperShift, S, exec, grim -g "$(slurp)" - | swappy -f - # take a screenshot

# Clipboard
bind = $mainMod, V, exec, cliphist list | rofi -plugin-path /usr/lib/rofi/ -dmenu -theme "~/.config/rofi/launchers/type-7/style-7.rasi" | cliphist decode | wl-copy # open clipboard manager

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Swap windows
bind = SuperShift, H, movewindow, l
bind = SuperShift, L, movewindow, r
bind = SuperShift, K, movewindow, u
bind = SuperShift, j, movewindow, d

# Window split ratio
binde = Super Ctrl, H, splitratio, -0.1
binde = Super Ctrl, L, splitratio, 0.1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
