background {
    monitor =
    path = "/home/grimaldev/wallpapers/the-last-of-us-part.jpg"   # only png supported for no
    brightness = 0.2172
    # color = rgba(255, 205, 205, 1.0)
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(A7C080)  # Everforest Green
    inner_color = rgb(2E383C)  # Everforest Background 1
    font_color = rgb(D3C6AA)  # Everforest Foreground
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(A7C080)  # Everforest Green
    fail_color = rgb(E67E80)  # Everforest Red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(211, 198, 170, 1.0)  # Everforest Foreground
    font_size = 155
    font_family = Fira Semibold
    position = -60, 20
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = GrimalDev
    color = rgba(167, 192, 128, 1.0)  # Everforest Green
    font_size = 50
    font_family = Fira Semibold
    position = -100, 260
    halign = right
    valign = bottom
    shadow_passes = 5
