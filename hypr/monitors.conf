# Monitor Configuration
# See https://wiki.hyprland.org/Configuring/Monitors/

# Make workspace 10 persistent on the secondary monitor
workspace = 10, monitor:$(hyprctl monitors -j | jq -r '.[] | select(.name != "eDP-1") | .name'), default:true

# 1. Internal monitor (Default)
monitor = eDP-1, preferred, auto, 1.6

# 2. Fallback for ANY external monitor
# This handles the "Main at its resolution" requirement automatically
monitor = , preferred, auto, 1

# 3. Lid Switch Bindings
bindl = , switch:on:Apple SMC power/lid events, exec, ~/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Apple SMC power/lid events, exec, ~/.config/hypr/scripts/lid.sh open

# 4. Initialize the event listener
exec-once = ~/.config/hypr/scripts/monitor-event.sh
