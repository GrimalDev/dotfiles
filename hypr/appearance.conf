# Appearance Configuration
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border   = rgb(A7C080)  # Everforest Green
    col.inactive_border = rgba(4F5B58fe)  # Everforest Background 5

    layout = dwindle
    allow_tearing = true

}

misc {
    disable_hyprland_logo = yes
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5

    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
    }

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = no

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.10, 0.9, 0.1, 1.05
    bezier = decel, 0.05, 0.7, 0.1, 1

    animation = windows, 0, 7, myBezier, slide
    animation = windowsOut, 0, 7, myBezier, slide
    animation = border, 0, 10, default
    animation = fade, 0, 7, default
    animation = workspaces, 0, 6, decel, slidefade 20%
    # animation = workspaces, 1, 6, decel, slide
}
