[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
if.window-title-regex-substring = '^file$'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = ['layout floating']

[[on-window-detected]]
if.app-id = "com.apple.finder"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.derlien.DiskInventoryX"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.1password.1password"
run = ["layout floating"]

