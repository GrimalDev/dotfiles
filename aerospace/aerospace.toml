# Place a copy of this config to ~/.aerospace.toml

# Start AeroSpace at login
start-at-login = true

# Start applications after AeroSpace startup
after-startup-command = [
    # "exec-and-forget /opt/homebrew/bin/borders style=round hdpi=1 width=3.0 active_color=0xffa3be8c inactive_color=0xfe3b4252",
    "exec-and-forget /opt/homebrew/bin/sketchybar",
    "exec-and-forget /opt/homebrew/bin/skhd",

    'exec-and-forget $HOME/.config/aerospace/scripts/start_app.sh "Notion"',
    'exec-and-forget $HOME/.config/aerospace/scripts/start_app.sh "Vivaldi"',
    'exec-and-forget $HOME/.config/aerospace/scripts/start_app.sh "kitty" "dev" "--title dev -e sesh connect \"Home 💻\"" "cli"',
    'exec-and-forget $HOME/.config/aerospace/scripts/start_app.sh "kitty" "btop" "--title btop -e btop" "cli"',
    'exec-and-forget $HOME/.config/aerospace/scripts/start_app.sh "Music"',
    'exec-and-forget $HOME/.config/aerospace/scripts/start_app.sh "Equibop"'
]

exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '/opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_workspace_change AEROSPACE_FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE AEROSPACE_PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layouts
accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Window management preferences
automatically-unhide-macos-hidden-apps = true

# [exec]
# inherit-env-vars = true
#
# [exec.env-vars]
# PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# Gaps between windows

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = [{ monitor.main = 55 }, 5]
outer.bottom = 5
outer.top = 5
outer.right = 5

# Key mapping
[key-mapping]
preset = 'qwerty'

# Main binding mode
[mode.main.binding]
cmd-h = [] # Disable "hide application"

# Ranger
cmd-e = 'exec-and-forget kitty --title file -e yazi ~'
# -- Custom window layouts --
cmd-r = 'exec-and-forget kitty -e bash /Users/grimaldev/.config/skhd/scripts/sesh-sessions.sh'

# Window focus controls (preserving your alt+cmd scheme)
alt-cmd-h = 'focus left'
alt-cmd-j = 'focus down'
alt-cmd-k = 'focus up'
alt-cmd-l = 'focus right'

# Window movement (preserving shift+cmd scheme)
shift-cmd-h = 'move left'
shift-cmd-j = 'move down'
shift-cmd-k = 'move up'
shift-cmd-l = 'move right'

# Resize commands (corrected to use valid parameters)
ctrl-cmd-h = 'resize smart -50'
ctrl-cmd-j = 'resize smart -50'
ctrl-cmd-k = 'resize smart +50'
ctrl-cmd-l = 'resize smart +50'

# Workspace movement (preserving ctrl+cmd scheme for moving windows)
shift-cmd-1 = 'move-node-to-workspace 1 --focus-follows-window'
shift-cmd-2 = 'move-node-to-workspace 2 --focus-follows-window'
shift-cmd-3 = 'move-node-to-workspace 3 --focus-follows-window'
shift-cmd-4 = 'move-node-to-workspace 4 --focus-follows-window'
shift-cmd-5 = 'move-node-to-workspace 5 --focus-follows-window'
shift-cmd-6 = 'move-node-to-workspace 6 --focus-follows-window'
shift-cmd-7 = 'move-node-to-workspace 7 --focus-follows-window'
shift-cmd-8 = 'move-node-to-workspace 8 --focus-follows-window'
shift-cmd-9 = 'move-node-to-workspace 9 --focus-follows-window'
shift-cmd-0 = 'move-node-to-workspace 10 --focus-follows-window'

# Workspace focus (preserving cmd scheme)
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'
cmd-0 = 'workspace 10'

# Monitor movement (corrected to use valid next/prev parameters)
shift-cmd-s = 'focus-monitor prev'
shift-cmd-g = 'focus-monitor next'

# Display focus (adapted from ctrl+cmd)
ctrl-cmd-s = 'move-workspace-to-monitor prev'
ctrl-cmd-g = 'move-workspace-to-monitor next'

# Layout commands (corrected to use valid layout types)
shift-cmd-y = 'layout vertical'    # Similar to y-axis mirror
shift-cmd-x = 'layout horizontal'  # Similar to x-axis mirror
shift-cmd-e = 'layout tiles horizontal vertical'  # Similar to balance

# Custom application launcher
# cmd-e = '''exec-and-forget osascript -e '
# tell application "kitty"
#     do script "ranger ~"
#     activate
# end tell'
# '''

# Service mode for additional commands
ctrl-alt-semicolon = 'mode service'
[mode.service.binding]
# Reset, reload, and layout controls
shift-r = ['''exec-and-forget osascript -e 'quit app "Aerospace"' -e 'delay 1' -e 'tell application "Aerospace" to activate' ''', 'mode main']
esc = ['reload-config', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Window rules for automatic workspace assignment
[[on-window-detected]]
if.app-id = 'notion.id'
run = ['move-node-to-workspace 2']

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
if.window-title-regex-substring = '^dev$'
run = ['move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
if.window-title-regex-substring = '^btop$'
run = ['move-node-to-workspace 5']

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['move-node-to-workspace 6']

[[on-window-detected]]
if.app-id = 'org.equicord.equibop'
run = ['move-node-to-workspace 9']

# -------------- FORCE TILING -------------

# [[on-window-detected]]
