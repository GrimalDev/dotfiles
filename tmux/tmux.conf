set-option -g default-shell /usr/sbin/fish

# set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g default-terminal 'xterm-kitty'
# set-option -g terminal-overrides 'xterm-kitty'
set-option -g focus-events on
set -g xterm-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on

set -g mouse on

bind-key -T copy-mode-vi Escape send-keys -X cancel

set-window-option -g mode-keys vi

set -g allow-passthrough on

# Easy config reload
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

unbind C-b
unbind C-h
# unbind C-f

set -g prefix C-a
bind C-a send-prefix

# use vim-like keys for splits and windows
# bind-key v split-window -h
# bind-key h split-window -v
bind -n M-h split-window -v
bind -n M-v split-window -h

bind -n M-H previous-window
bind -n M-L next-window
set-option -g @ssh-split-keep-cwd "true"
set-option -g @ssh-split-keep-remote-cwd "true"
set-option -g @ssh-split-fail "false"
set-option -g @ssh-split-h-key "h"
set-option -g @ssh-split-v-key "v"

bind -n M-y copy-mode

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux';
# set -g @plugin 'TanglingTreats/tmux-everforest' # Adds to the list of plugins
# set -g @tmux-everforest 'dark-medium' # Sets the option to select the theme. Also the default.
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'pschmitt/tmux-ssh-split'

# smart pane switching with awareness of vim splits
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R
# vim_pattern='(\\S+\\/)?g?\.?(view|l?n?nvim?x?|fzf)(diff)?(-wrapped)?$'
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
#     | grep -iqE '^[^TXZ ]+ +${vim_pattern}'"
# bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
# bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
# bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
# bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# remove bindings on C-hjkl
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

bind -n M-n switch-client -n
bind -n M-p switch-client -p

bind -n M-j select-window -t 1
bind -n M-k select-window -t 2
bind -n M-l select-window -t 3
bind -n "M-;" select-window -t 4
bind -n M-M swap-window -t 1
bind -n M-< swap-window -t 2
bind -n M-> swap-window -t 3
bind -n M-/ swap-window -t 4

# vim-like pane resizing
bind -n C-M-h resize-pane -L
bind -n C-M-j resize-pane -D
bind -n C-M-k resize-pane -U
bind -n C-M-l resize-pane -R

bind -n C-/ send-keys 'C-/'
bind -n C-_ send-keys 'C-/'
bind -n C-S-h send-keys 'F9'
bind -n C-S-l send-keys 'F10'
bind -n C-S-k send-keys 'F11'
bind -n C-S-j send-keys 'F12'

bind -n M-o new-window -c '#{pane_current_path}' 'fastfetch --config ~/.config/fastfetch/config.json && fish -l'
bind -n C-M-x confirm-before kill-pane
bind -n C-x confirm-before -p "kill-session #S? (y/n)" "run-shell 'tmux switch-client -p \\\; kill-session -t \"#S\"'"

# bind -n C-space run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer.fish"
bind -n C-space run-shell "/home/grimaldev/go/bin/sesh connect \"$(
    /home/grimaldev/go/bin/sesh list -i | fzf-tmux -p 55%,60% --ansi \
        --no-sort --border-label ' sesh ' --prompt '⚡  ' \
        --header '  ^a add dir |  ^d delete session |  Enter to connect ' \
        --bind 'ctrl-j:down,ctrl-k:up' \
        --bind 'ctrl-a:execute(mkdir -p ~/Code/Projects/{q} && zoxide add ~/Code/Projects/{q} && /home/grimaldev/go/bin/sesh connect ~/Code/Projects/{q})+abort' \
        --bind 'ctrl-d:execute(tmux kill-session -t $(echo {} | cut -c3-))+change-prompt(⚡  )+reload(/home/grimaldev/go/bin/sesh list -i)'
)\""
# bind -n C-f send-keys 'C-f'

set -sg escape-time 0
set -g status-interval 1     # update the status bar every 3 seconds

# unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g status-left "#[fg=blue,bold,bg=#2b3339]  #S   "
set -g status-right "#[fg=#b4befe,bold,bg=#2b3339]%a %d-%m-%Y 󱑒 %H:%M"
set -ga status-right "#($HOME/.config/tmux/scripts/kitty_font_size.sh)"
set -ga status-right "#($HOME/.config/tmux/scripts/cal.sh)"
set -g status-justify left
set -g status-left-length 200    # increase length (from 10)
set -g status-right-length 200    # increase length (from 10)
set -g status-position top       # macOS / darwin style
set -g status-style 'bg=#2b3339' # transparent
set -g window-status-current-format '#[fg=magenta,bg=#2b3339] *#I #W'
set -g window-status-format '#[fg=#adbabf,bg=#2b3339] #I #W'
set -g window-status-last-style 'fg=white,bg=black'
set -g message-command-style bg=default,fg=yellow
set -g message-style bg=default,fg=yellow
set -g mode-style bg=default,fg=yellow
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# run-shell "fish -c genSeshConfig"

run '~/.config/tmux/plugins/tpm/tpm'
